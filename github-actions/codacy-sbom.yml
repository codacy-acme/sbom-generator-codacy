# Copy to .github/workflows/codacy-sbom.yml
# Requires a repository secret named CODACY_API_TOKEN.
name: Codacy SBOM

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: myapp
  IMAGE_VERSION: ${{ github.sha }}
  ORGANIZATION_NAME: my-org
  REPOSITORY_NAME: ${{ github.event.repository.name }}

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "${IMAGE_NAME}:${IMAGE_VERSION}" .

      - name: Install Codacy CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/codacy/codacy-cli-v2/main/codacy-cli.sh -o codacy-cli.sh
          chmod +x codacy-cli.sh
          ./codacy-cli.sh init

      # One list, kept up to date
      - name: Upload SBOM to Codacy
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          docker tag "${IMAGE_NAME}:${IMAGE_VERSION}" "${IMAGE_NAME}:prod"
          ./codacy-cli.sh upload-sbom \
            -a "${CODACY_API_TOKEN}" \
            -p gh \
            -o "${ORGANIZATION_NAME}" \
            -r "${REPOSITORY_NAME}" \
            -e production \
            "${IMAGE_NAME}:prod"

      # A separate list per release: replace the step above with this one.
